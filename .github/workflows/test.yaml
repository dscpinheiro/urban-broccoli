name: Label Build Test

permissions: {}

on:
  pull_request:
    types: [labeled]

jobs:
  build:
    name: build
    if: >-
      github.event.label.name == 'run-build' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      issues: write          # remove the label via the issues API
      contents: read
    steps:
      - name: Placeholder build
        run: echo "would build here"
      - name: Remove run-build label
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/run-build" || true
