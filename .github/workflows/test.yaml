name: Permission Check Test

permissions: {}

on:
  issue_comment:
    types: [created]

jobs:
  test:
    name: test
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/run-build' &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write          # comment on the associated issue
      pull-requests: write   # react to PR conversation
      statuses: write        # post the commit status that shows as a PR check
      contents: read
    steps:
      - name: Verify requester permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          push=$(gh api "repos/$REPO/collaborators/$COMMENT_AUTHOR/permission" --jq .user.permissions.push)
          echo "push permission: $push"
          [ "$push" = "true" ] || { echo "::error::$COMMENT_AUTHOR lacks push access; refusing build"; exit 1; }
      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: echo "head_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)" >> "$GITHUB_OUTPUT"
      - name: Mark check pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=pending -f context=build-sdk-v4 -f description="Build running" \
            -f target_url="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
      - name: Acknowledge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes
      - name: Placeholder build
        run: echo "would build here"
      - name: Report final check
        if: always() && steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RESULT: ${{ job.status }}
        run: |
          state=success; [ "$RESULT" = "success" ] || state=failure
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=$state -f context=build-sdk-v4 -f description="Build $state" \
            -f target_url="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
