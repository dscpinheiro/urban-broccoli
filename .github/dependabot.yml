version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/s3-backup-cdk"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns:
          - "*"
